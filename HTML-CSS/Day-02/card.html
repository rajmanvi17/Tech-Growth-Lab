<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body> 

<div class="card-container">
<div class="card">
    <img src="product1.png" alt="Wireless Headphones">
    <h2>Wireless Headphones</h2>

    <p>High quality wireless headphones with great sound</p>

    <h3>$15</h3>

    <button>Buy Now</button>
</div>

<div class="card">
    <img src="product2.png" alt="Keyboard">

    <h2>Keyboard</h2>

    <p>High quality wireless keyboard with fast working</p>

    <h3>$17</h3>

    <button>Buy Now</button>
</div>

<div class="card">
    <img src="product3.png" alt="Mouse">

    <h2>Mouse</h2>

    <p>High quality wireless mouse with fast working</p>

    <h3>$10</h3>

    <button>Buy Now</button>
</div>
</div>

</body>
